<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S26 · พนักงานและสิทธิ์ — อมาเนว์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Prompt:wght@400;600;700&family=Sarabun:wght@400;500;600&family=Noto+Sans+Thai:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="shared.css">
<style>
  .staff-grid { display: grid; grid-template-columns: 260px 1fr; gap: var(--gap); align-items: start; }
  @media (max-width: 820px) { .staff-grid { grid-template-columns: 1fr; } }
  .staff-list { display: flex; flex-direction: column; gap: 8px; }
  .staff-row {
    display: flex; flex-direction: column; gap: 2px; text-align: left;
    border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px;
    background: var(--card-bg);
  }
  .staff-row.selected { border-color: var(--primary); background: var(--primary-soft); }
  .staff-row .sr-name { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .staff-row .sr-phone { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
  .staff-row .sr-sub { font-size: 12px; color: var(--text-muted); }
  .staff-row.owner-row { border-style: dashed; opacity: .85; cursor: default; }
  .preset-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .preset-row .preset-label { font-size: 12px; color: var(--text-muted); }
  .perm-grid { columns: 2; column-gap: 20px; margin-bottom: 6px; }
  @media (max-width: 560px) { .perm-grid { columns: 1; } }
  .perm-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    break-inside: avoid; font-size: var(--fs-base);
  }
  .perm-row input { width: 18px; height: 18px; accent-color: var(--primary); flex: none; }
  .perm-row .perm-owner-tag { font-size: 11px; color: var(--text-muted); }
  .perm-row.locked { opacity: .55; }
</style>
</head>
<body data-style="a" data-screen="S26" data-title="พนักงานและสิทธิ์">
<div class="page-content" id="page-content">

  <div class="page-header-row">
    <h3 style="margin:0;">พนักงาน <span class="muted" id="staff-count"></span></h3>
    <div class="spacer"></div>
    <button type="button" class="btn btn-secondary btn-sm" disabled title="สาธิตเท่านั้น">+ เพิ่มพนักงาน</button>
  </div>

  <div class="staff-grid">
    <div class="card staff-list" id="staff-list"></div>

    <div class="card" style="display:flex; flex-direction:column; gap:4px;">
      <h3 id="panel-title" style="margin-bottom:2px;"></h3>
      <p class="muted" id="panel-sub" style="font-size:12.5px; margin-bottom:12px;"></p>

      <div class="preset-row" id="preset-row"></div>

      <div class="perm-grid" id="perm-grid"></div>

      <div class="demo-note" style="margin-top:6px;">ทุกการเปลี่ยนสิทธิ์บันทึกลง audit log — ดูได้จากประวัติการแก้ไข (S15/audit)</div>
      <div style="margin-top:10px;">
        <button type="button" class="btn btn-primary" id="btn-save" data-primary>บันทึก</button>
      </div>
    </div>
  </div>

</div>

<script src="../switcher.js"></script>
<script src="role.js"></script>
<script src="data.js"></script>
<script src="demo.js"></script>
<script src="nav.js"></script>
<script>
  var D = window.AmanewData;
  var qs = location.search;
  var qsAmp = qs.replace(/^\?/, '&');

  document.getElementById('staff-count').textContent = '· ' + D.staff.length + ' คน';

  var selectedId = D.staff[0].id;

  function presetLabel(s) {
    return s.roles.map(function (r) { return D.ROLE_PRESETS[r].label; }).join(' + ');
  }

  function renderList() {
    var rows = D.staff.map(function (s) {
      return '<button type="button" class="staff-row' + (s.id === selectedId ? ' selected' : '') + '" data-staff="' + s.id + '">' +
        '<span class="sr-name">' + s.name + '<span class="sr-phone">' + s.phone + '</span></span>' +
        '<span class="sr-sub">' + presetLabel(s) + ' · ' + s.perms.length + ' สิทธิ์</span></button>';
    }).join('');
    rows += '<div class="staff-row owner-row"><span class="sr-name">' + D.owner.name + '</span>' +
      '<span class="sr-sub">ทุกสิทธิ์ · แก้ไขไม่ได้</span></div>';
    document.getElementById('staff-list').innerHTML = rows;
    document.querySelectorAll('[data-staff]').forEach(function (btn) {
      btn.addEventListener('click', function () { selectedId = btn.dataset.staff; render(); });
    });
  }

  function render() {
    renderList();
    var s = D.findStaff(selectedId);
    document.getElementById('panel-title').textContent = s.name;
    document.getElementById('panel-sub').textContent = s.phone + ' · ' + presetLabel(s);

    var presets = Object.keys(D.ROLE_PRESETS).map(function (key) {
      var active = s.roles.indexOf(key) !== -1;
      return '<button type="button" class="chip' + (active ? ' active' : '') + '" data-preset="' + key + '">' + D.ROLE_PRESETS[key].label + '</button>';
    }).join('');
    document.getElementById('preset-row').innerHTML = '<span class="preset-label">ชุดสำเร็จ:</span>' + presets;
    document.querySelectorAll('[data-preset]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.dataset.preset;
        var idx = s.roles.indexOf(key);
        if (idx === -1) {
          s.roles.push(key);
          D.ROLE_PRESETS[key].perms.forEach(function (p) { if (s.perms.indexOf(p) === -1) s.perms.push(p); });
        } else {
          s.roles.splice(idx, 1);
        }
        render();
      });
    });

    document.getElementById('perm-grid').innerHTML = D.PERMISSIONS.map(function (p) {
      var checked = s.perms.indexOf(p.key) !== -1;
      var locked = !!p.ownerOnly;
      return '<label class="perm-row' + (locked ? ' locked' : '') + '">' +
        '<input type="checkbox" data-perm="' + p.key + '"' + (checked ? ' checked' : '') + (locked ? ' disabled' : '') + '>' +
        '<span>' + p.label + (locked ? ' <span class="perm-owner-tag">(owner)</span>' : '') + '</span></label>';
    }).join('');
    document.querySelectorAll('[data-perm]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var key = cb.dataset.perm;
        var idx = s.perms.indexOf(key);
        if (cb.checked && idx === -1) s.perms.push(key);
        if (!cb.checked && idx !== -1) s.perms.splice(idx, 1);
      });
    });
  }

  render();

  document.getElementById('btn-save').addEventListener('click', function (e) {
    var btn = e.currentTarget;
    var original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" aria-hidden="true"></span> กำลังบันทึก…';
    setTimeout(function () {
      btn.disabled = false;
      btn.innerHTML = original;
      location.href = 's26-staff-permissions.html?banner=' + encodeURIComponent('บันทึกสิทธิ์ของ ' + D.findStaff(selectedId).name + ' แล้ว') + qsAmp;
    }, 700);
  });
</script>
</body>
</html>
