<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S05 · ค้นหาผู้เช่า — อมาเนว์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Prompt:wght@400;600;700&family=Sarabun:wght@400;500;600&family=Noto+Sans+Thai:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="shared.css">
</head>
<body data-style="a" data-screen="S05" data-title="ค้นหาผู้เช่า">
<div class="page-content" id="page-content">

  <div class="wizard-stepper">
    <div class="wiz-step done"><span class="wiz-num">✓</span> เลือกห้อง</div>
    <div class="wiz-connector"></div>
    <div class="wiz-step current"><span class="wiz-num">2</span> ค้นหาผู้เช่า</div>
    <div class="wiz-connector"></div>
    <div class="wiz-step"><span class="wiz-num">3</span> ข้อมูลการเข้าพัก</div>
  </div>

  <div class="card" style="max-width:440px;">
    <h3>กรอกเบอร์โทรศัพท์ผู้เช่า/แขก</h3>
    <div id="room-slot"></div>
    <form id="lookup-form">
      <div class="field full" style="margin-bottom:14px;">
        <label>เบอร์โทรศัพท์ <span class="req">*</span></label>
        <input type="tel" id="phone" placeholder="เช่น 081-234-5678" required>
        <div class="hint">ลองใช้ 081-234-5678 (มีในระบบ) หรือเบอร์อื่นเพื่อดูขั้นตอนลงทะเบียนใหม่</div>
      </div>
      <button type="submit" class="btn btn-primary" data-primary>ค้นหา</button>
    </form>
  </div>

</div>

<!-- S06 — Match confirmation modal -->
<div class="modal-overlay" id="match-modal" aria-hidden="true">
  <div class="modal-box">
    <span class="screen-id">S06 · ยืนยันข้อมูล</span>
    <h2>พบข้อมูลผู้เช่า</h2>
    <div class="tenant-chip" id="match-chip"><span class="tc-name" id="match-name"></span><span class="tc-phone" id="match-phone"></span></div>
    <div class="muted" id="match-history" style="font-size:13px;"></div>
    <p>ใช่ผู้เช่ารายนี้หรือไม่?</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="match-no">ไม่ใช่ ค้นหาใหม่</button>
      <button type="button" class="btn btn-primary" id="match-yes">ใช่ ใช้ข้อมูลนี้</button>
    </div>
  </div>
</div>

<script src="../switcher.js"></script>
<script src="role.js"></script>
<script src="data.js"></script>
<script src="demo.js"></script>
<script src="nav.js"></script>
<script>
  var D = window.AmanewData;
  var qs = location.search;
  var qsAmp = qs.replace(/^\?/, '&');
  var params = new URLSearchParams(qs);
  var flow = params.get('flow') === 'daily' ? 'daily' : 'monthly';
  var roomNo = params.get('room');

  // The room is always chosen on the floor plan (S03 picker), never from a
  // 40-option dropdown here — landing on this screen without one means the user
  // skipped step 1, so send them to the picker instead of improvising a select.
  if (!roomNo) {
    location.replace('s03-room-grid.html?pick=' + flow + qs.replace(/^\?/, '&'));
  } else {
    var r = D.room(roomNo);
    var type = r ? D.roomTypeOf(r) : null;
    document.getElementById('room-slot').innerHTML =
      '<div class="field full" style="margin-bottom:14px;">' +
        '<label>ห้องที่เลือก</label>' +
        '<div style="display:flex; align-items:center; gap:10px;">' +
          '<span style="font-family:var(--font-mono); font-size:20px; font-weight:700;">ห้อง ' + roomNo + '</span>' +
          (type ? '<span class="type-chip ' + type.key + '">' + type.icon + ' ' + type.short + '</span>' : '') +
          '<a class="btn btn-ghost btn-sm" href="s03-room-grid.html?pick=' + flow + qs.replace(/^\?/, '&') + '">เปลี่ยนห้อง</a>' +
        '</div>' +
      '</div>';
  }

  function currentRoom() { return roomNo; }

  // A phone carried in from global search (returning tenant) pre-fills the box.
  var carriedPhone = params.get('phone');
  if (carriedPhone) document.getElementById('phone').value = carriedPhone;

  var lastPhone = '';
  var form = document.getElementById('lookup-form');
  Demo.submitWithSpinner(form, function (e, restore) {
    lastPhone = document.getElementById('phone').value.trim();
    var tenant = D.findTenantByPhone(lastPhone);
    if (tenant) {
      document.getElementById('match-name').textContent = tenant.name;
      document.getElementById('match-phone').textContent = tenant.phone;
      document.getElementById('match-history').textContent = tenant.history;
      document.getElementById('match-chip').classList.toggle('monthly', flow === 'monthly');
      document.getElementById('match-chip').classList.toggle('daily', flow === 'daily');
      Demo.openDialog('match-modal', form.querySelector('[data-primary]'));
      restore();
    } else {
      var dest = flow === 'monthly' ? 's08-monthly-tenancy.html' : 's10-daily-booking.html';
      location.href = 's07-new-tenant.html?phone=' + encodeURIComponent(lastPhone) + '&flow=' + flow + '&room=' + currentRoom() + qsAmp;
    }
  }, 500);

  document.getElementById('match-no').addEventListener('click', function () {
    Demo.closeDialog('match-modal');
    document.getElementById('phone').value = '';
    document.getElementById('phone').focus();
  });
  document.getElementById('match-yes').addEventListener('click', function () {
    var tenant = D.findTenantByPhone(lastPhone);
    var dest = flow === 'monthly' ? 's08-monthly-tenancy.html' : 's10-daily-booking.html';
    location.href = dest + '?name=' + encodeURIComponent(tenant.name) + '&phone=' + encodeURIComponent(tenant.phone) +
      '&room=' + currentRoom() + qsAmp;
  });
</script>
</body>
</html>
