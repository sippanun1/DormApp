<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S38 · การแจ้งเตือน — อมาเนว์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Prompt:wght@400;600;700&family=Sarabun:wght@400;500;600&family=Noto+Sans+Thai:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="shared.css">
<style>
  .channel-card { border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .channel-card.on { border-color: var(--success); background: var(--success-soft); }
  .channel-head { display: flex; align-items: center; gap: 10px; }
  .channel-head .ch-icon { width: 38px; height: 38px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 19px; background: var(--surface); }
  .channel-head .ch-icon.line { background: #06C755; color: #fff; font-weight: 700; font-size: 13px; }
  .channel-head .ch-name { font-weight: 700; font-size: 15px; flex: 1; }
  .channel-card .ch-sub { font-size: 12px; color: var(--text-muted); }
  /* Switch rows: whole row is the tap target, 52px tall. */
  .switch-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .switch-row:last-child { border-bottom: none; }
  .switch-row .sr-main { flex: 1; }
  .switch-row .sr-name { font-weight: 600; font-size: 14px; }
  .switch-row .sr-sub { font-size: 12px; color: var(--text-muted); }
  .switch { width: 52px; height: 30px; border-radius: 999px; border: none; background: var(--neutral-soft); position: relative; flex: 0 0 52px; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 999px; background: #fff; box-shadow: var(--card-shadow); transition: left .15s ease; }
  .switch.on { background: var(--success); }
  .switch.on::after { left: 25px; }
  .switch:disabled { opacity: .5; }
</style>
</head>
<body data-style="a">
<div class="phone-stage">
  <div class="phone-frame">
    <div class="phone-header">
      <a class="btn btn-ghost btn-sm" href="s33-tenant-home.html">←</a>
      <span class="user-chip"><span class="avatar">ส</span><span>คุณสมชาย ใจดี</span></span>
      <div class="spacer" style="flex:1;"></div>
      <span class="screen-id">S38 · การแจ้งเตือน</span>
    </div>
    <div class="phone-body">

      <div class="section-title">ช่องทางแจ้งเตือน</div>

      <div class="channel-card on">
        <div class="channel-head">
          <span class="ch-icon">🔔</span>
          <span class="ch-name">ในแอป</span>
          <button type="button" class="switch on" disabled aria-label="ในแอป"></button>
        </div>
        <div class="ch-sub">เปิดตลอด ปิดไม่ได้ — เป็นช่องทางหลักที่ระบบใช้บันทึกว่าแจ้งผู้เช่าแล้ว</div>
      </div>

      <!-- LINE is an optional add-on, not the system of record (Business Rule 12.5).
           Anything sent to LINE is a copy of the in-app notification, so a failed
           or unlinked LINE never means the tenant was not notified. -->
      <div class="channel-card" id="line-card">
        <div class="channel-head">
          <span class="ch-icon line">LINE</span>
          <span class="ch-name">LINE</span>
          <button type="button" class="switch" id="line-switch" aria-label="LINE"></button>
        </div>
        <div class="ch-sub" id="line-sub">ยังไม่ได้เชื่อมต่อ — รับแจ้งเตือนบิลและใบเสร็จทาง LINE ได้</div>
        <button type="button" class="btn btn-secondary" id="line-connect" style="width:100%;">เชื่อมต่อบัญชี LINE</button>
      </div>

      <div class="section-title" style="margin-top:6px;">เรื่องที่จะแจ้งเตือน</div>
      <div class="card" id="event-list" style="padding:6px 14px;"></div>

      <div class="demo-note" id="preview-note">ตัวอย่างข้อความที่ผู้เช่าจะได้รับ ↓</div>
      <div class="card" id="preview-card" style="gap:6px;"></div>

    </div>
  </div>
</div>

<script src="../switcher.js"></script>
<script src="data.js"></script>
<script src="demo.js"></script>
<script>
  var D = window.AmanewData;
  var inv = D.tenantHome.currentInvoice;

  var lineOn = false;
  var events = [
    { key: 'bill', name: 'บิลใหม่ออกแล้ว', sub: 'ทุกวันที่ 1 ของเดือน พร้อมยอดรวม', on: true },
    { key: 'due', name: 'ใกล้ครบกำหนดชำระ', sub: 'เตือนล่วงหน้า 2 วันก่อนวันที่ 5', on: true },
    { key: 'late', name: 'เลยกำหนด — มีค่าปรับ', sub: 'เตือนเมื่อเริ่มคิดค่าปรับ ฿50/วัน', on: true },
    { key: 'receipt', name: 'ยืนยันการชำระเงิน / ใบเสร็จ', sub: 'เมื่อเจ้าหน้าที่ตรวจสอบสลิปแล้ว', on: true },
    { key: 'contract', name: 'ใกล้ครบสัญญา', sub: 'เตือนล่วงหน้า 30 วัน', on: true },
    { key: 'announce', name: 'ประกาศจากหอพัก', sub: 'เช่น น้ำไม่ไหล ดับไฟ', on: false }
  ];

  function renderEvents() {
    document.getElementById('event-list').innerHTML = events.map(function (e, i) {
      return '<div class="switch-row" data-i="' + i + '">' +
        '<div class="sr-main"><div class="sr-name">' + e.name + '</div><div class="sr-sub">' + e.sub + '</div></div>' +
        '<button type="button" class="switch' + (e.on ? ' on' : '') + '" aria-label="' + e.name + '"></button>' +
      '</div>';
    }).join('');
  }

  function renderLine() {
    var card = document.getElementById('line-card');
    card.classList.toggle('on', lineOn);
    document.getElementById('line-switch').classList.toggle('on', lineOn);
    document.getElementById('line-sub').innerHTML = lineOn
      ? 'เชื่อมต่อแล้ว · บัญชี <strong>somchai.j</strong> — ข้อความจะส่งเข้า LINE พร้อมกับแจ้งเตือนในแอป'
      : 'ยังไม่ได้เชื่อมต่อ — รับแจ้งเตือนบิลและใบเสร็จทาง LINE ได้';
    document.getElementById('line-connect').textContent = lineOn ? 'ยกเลิกการเชื่อมต่อ LINE' : 'เชื่อมต่อบัญชี LINE';
    renderPreview();
  }

  function renderPreview() {
    var billOn = events.filter(function (e) { return e.key === 'bill'; })[0].on;
    if (!billOn) {
      document.getElementById('preview-card').innerHTML =
        '<span class="muted" style="font-size:13px;">ปิดการแจ้งเตือนบิลใหม่ไว้ — จะไม่มีข้อความส่งออกเมื่อออกบิล</span>';
      return;
    }
    document.getElementById('preview-card').innerHTML =
      '<div style="display:flex; align-items:center; gap:8px;">' +
        '<span class="ch-icon ' + (lineOn ? 'line' : '') + '" style="width:28px;height:28px;font-size:12px;' +
          (lineOn ? '' : 'background:var(--surface);') + '">' + (lineOn ? 'LINE' : '🔔') + '</span>' +
        '<strong style="font-size:13px;">' + (lineOn ? 'ส่งทาง LINE + ในแอป' : 'ส่งในแอปอย่างเดียว') + '</strong></div>' +
      '<div style="font-size:13px; line-height:1.6; border-left:3px solid var(--info); padding-left:10px;">' +
        'อมาเนว์ เรสซิเดนซ์<br>' +
        'บิลเดือน ' + (inv.billingPeriod || 'กรกฎาคม 2569') + ' ห้อง ' + D.tenantHome.room + ' ออกแล้ว<br>' +
        'ยอดรวม <strong>' + D.money(inv.total) + '</strong> · ครบกำหนด ' + inv.dueDate + '<br>' +
        'ดูรายละเอียดและแจ้งชำระเงินในแอป' +
      '</div>' +
      '<div class="muted" style="font-size:11px;">ไม่ส่งสลิป ไม่ส่งข้อมูลส่วนตัวทาง LINE — ส่งเฉพาะยอดและกำหนดชำระ</div>';
  }

  document.getElementById('event-list').addEventListener('click', function (e) {
    var row = e.target.closest('.switch-row');
    if (!row) return;
    events[Number(row.dataset.i)].on = !events[Number(row.dataset.i)].on;
    renderEvents();
    renderPreview();
  });

  function toggleLine() {
    lineOn = !lineOn;
    renderLine();
    if (lineOn) alert('เชื่อมต่อ LINE สำเร็จ (สาธิต) — ของจริงจะเปิดหน้า LINE ให้กดยินยอม แล้วกลับมาที่แอป');
  }
  document.getElementById('line-connect').addEventListener('click', toggleLine);
  document.getElementById('line-switch').addEventListener('click', toggleLine);

  renderEvents();
  renderLine();
</script>
</body>
</html>
