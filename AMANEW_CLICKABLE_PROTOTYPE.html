<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amanew — Clickable Prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF9F6;--surface:#FFFFFF;--ink:#1A1D23;--ink-soft:#5A6070;--ink-faint:#9AA0AE;
  --line:#E6E4DE;--line-strong:#CFCCC4;
  --indigo:#2B3A67;--indigo-soft:#EDF0F7;--indigo-hover:#22305A;
  --green:#2E7D4F;--green-soft:#EAF4EE;
  --amber:#B87514;--amber-soft:#FBF3E4;
  --red:#B3372B;--red-soft:#FBEEEC;
  --focus:#2B3A67;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5}
.mono{font-family:'IBM Plex Mono',monospace}
.nav{display:flex;align-items:center;gap:4px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 28px;height:56px;position:sticky;top:0;z-index:5}
.nav .brand{font-weight:700;font-size:15px;letter-spacing:.02em;margin-right:28px;color:var(--indigo);cursor:pointer}
.nav a{display:flex;align-items:center;height:56px;padding:0 16px;color:var(--ink-soft);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;cursor:pointer}
.nav a.active{color:var(--indigo);border-bottom-color:var(--indigo)}
.nav a:hover{color:var(--ink)}
.nav .user{margin-left:auto;font-size:13px;color:var(--ink-faint)}
.nav .user b{color:var(--ink-soft);font-weight:600}
.page{max-width:1240px;margin:0 auto;padding:28px}
.page.narrow{max-width:720px}
.page.mid{max-width:880px}
.crumb{font-size:12.5px;color:var(--ink-faint);margin-bottom:20px}
.crumb b{color:var(--ink-soft);font-weight:500}
.crumb a{color:var(--indigo);cursor:pointer;text-decoration:none}
.crumb a:hover{text-decoration:underline}
h1{font-size:21px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px}
label{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:6px}
label .opt{font-weight:400;color:var(--ink-faint)}
input,select{font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
input.mono{font-family:'IBM Plex Mono',monospace}
input:focus,select:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--indigo)}
input:disabled{background:var(--paper);color:var(--ink-soft)}
input.err{border-color:var(--red)}
.field{margin-bottom:18px}
.field .msg{font-size:12px;color:var(--red);margin-top:5px;display:none}
.field.invalid .msg{display:block}
.field.invalid label{color:var(--red)}
.row{display:flex;gap:16px;align-items:flex-end}
.row .field{flex:1}
.ref{font-size:12px;color:var(--ink-faint);margin-bottom:4px;font-family:'IBM Plex Mono',monospace}
.hintline{font-size:12.5px;color:var(--ink-faint);margin-top:2px}
.btn{font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;border:1px solid transparent;cursor:pointer;transition:background .1s ease}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn.primary{background:var(--indigo);color:#fff}
.btn.primary:hover{background:var(--indigo-hover)}
.btn.primary:disabled{background:var(--ink-faint);cursor:default}
.btn.secondary{background:var(--surface);color:var(--ink-soft);border-color:var(--line-strong)}
.btn.secondary:hover{background:var(--paper)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger:hover{background:#9C2F25}
.btn.sm{font-size:13px;padding:6px 14px}
.btn-row{display:flex;gap:12px;margin-top:26px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation-duration:1.5s}}
.overlay{position:fixed;inset:0;background:rgba(26,29,35,.45);display:none;align-items:center;justify-content:center;z-index:10}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:14px;padding:28px 30px;width:400px;box-shadow:0 8px 32px rgba(26,29,35,.18)}
.modal .kicker{font-size:12px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.modal .kicker.danger{color:var(--red)}
.modal .kicker.success{color:var(--green)}
.modal h2{font-size:16px;font-weight:600;margin-bottom:4px}
.modal p{font-size:14px;color:var(--ink-soft);margin-bottom:8px}
.modal .btn-row{margin-top:22px}
/* Dashboard */
.summary{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 20px;min-width:150px}
.stat .label{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;margin-bottom:2px}
.stat .value{font-size:24px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.g{background:var(--green)}.dot.i{background:var(--indigo)}.dot.a{background:var(--amber)}.dot.r{border:2px dashed var(--ink-faint);width:7px;height:7px}
/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid var(--line)}
.tab{padding:10px 22px;font-weight:600;font-size:14px;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;background:none;border-top:none;border-left:none;border-right:none;font-family:'IBM Plex Sans',sans-serif}
.tab.on{color:var(--indigo);border-bottom-color:var(--indigo)}
.tab .cnt{font-weight:400;color:var(--ink-faint);font-size:12px;margin-left:6px}
.floor{margin-bottom:26px}
.floor-label{font-size:12px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px}
.room{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:8px;padding:12px 14px;cursor:pointer;transition:box-shadow .12s ease,transform .12s ease;text-align:left;width:100%;font-family:'IBM Plex Sans',sans-serif}
.room:hover{box-shadow:0 2px 8px rgba(26,29,35,.08);transform:translateY(-1px)}
.room .num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px}
.room .who{font-size:12.5px;color:var(--ink-soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:19px}
.room .tag{font-size:11px;font-weight:600;margin-top:6px;display:inline-block;padding:2px 8px;border-radius:20px}
.room.vacant{border-left-color:var(--green)}.room.vacant .tag{background:var(--green-soft);color:var(--green)}
.room.monthly{border-left-color:var(--indigo)}.room.monthly .tag{background:var(--indigo-soft);color:var(--indigo)}
.room.daily{border-left-color:var(--amber)}.room.daily .tag{background:var(--amber-soft);color:var(--amber)}
.room.reserved{border-left-style:dashed;border-left-color:var(--ink-faint)}.room.reserved .tag{background:var(--paper);color:var(--ink-soft);border:1px dashed var(--line-strong)}
.banner{display:flex;align-items:center;gap:10px;background:var(--green-soft);border:1px solid #CBE5D5;color:var(--green);border-radius:8px;padding:10px 16px;margin-bottom:18px;font-weight:500;font-size:13.5px}
.banner .x{margin-left:auto;background:none;border:none;color:var(--green);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px}
.step-dot{display:flex;gap:6px;margin-bottom:22px}
.step-dot span{height:4px;border-radius:2px;flex:1;background:var(--line)}
.step-dot span.on{background:var(--indigo)}
.tenant-chip{display:flex;align-items:center;gap:12px;border-radius:10px;padding:12px 16px;margin-bottom:22px}
.tenant-chip.im{background:var(--indigo-soft)}.tenant-chip.im .avatar{background:var(--indigo)}
.tenant-chip.am{background:var(--amber-soft)}.tenant-chip.am .avatar{background:var(--amber)}
.tenant-chip .avatar{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.tenant-chip .name{font-weight:600;font-size:14px}
.tenant-chip .phone{font-size:12.5px;color:var(--ink-soft)}
.nights{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);text-align:center}
.legalbar{display:flex;align-items:center;gap:10px;background:var(--amber-soft);border:1px solid #EAD9B8;border-radius:8px;padding:10px 16px;margin-bottom:22px;font-size:13px;color:var(--amber);font-weight:500}
.group-title{font-size:12px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;padding-bottom:8px;border-bottom:1px solid var(--line);margin:22px 0 16px}
.group-title:first-of-type{margin-top:0}
.money{width:100%;max-width:420px;border-collapse:collapse;font-size:14px}
.money td{padding:9px 0}.money td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace}
.money tr.line td{border-top:1px solid var(--line)}.money tr.total td{border-top:2px solid var(--ink);font-weight:600;font-size:15px}.money .dim{color:var(--ink-soft)}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;border-bottom:1px solid var(--line-strong)}
.table td{padding:11px 12px;border-bottom:1px solid var(--line)}
.table td.r,.table th.r{text-align:right}.table td.mono{font-family:'IBM Plex Mono',monospace}
.table tr.click{cursor:pointer}.table tr.click:hover{background:var(--indigo-soft)}
.pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;display:inline-block}
.pill.unpaid{background:var(--red-soft);color:var(--red)}.pill.pending{background:var(--amber-soft);color:var(--amber)}
.pill.paid{background:var(--green-soft);color:var(--green)}.pill.rejected{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line-strong)}
.filters{display:flex;gap:8px;margin-bottom:16px}
.chip{font-size:13px;font-weight:500;padding:6px 14px;border-radius:20px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);cursor:pointer;font-family:'IBM Plex Sans',sans-serif}
.chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.batch{display:flex;gap:12px;margin-bottom:26px}.bstat{border:1px solid var(--line);border-radius:10px;padding:16px 20px;flex:1;background:var(--surface)}
.bstat .l{font-size:12.5px;color:var(--ink-soft);margin-bottom:2px}.bstat .v{font-size:26px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.bstat.ok{border-top:3px solid var(--green)}.bstat.skip{border-top:3px solid var(--ink-faint)}.bstat.warn{border-top:3px solid var(--amber)}
.verify-grid{display:grid;grid-template-columns:320px 1fr;gap:28px}
.slip{border:1px solid var(--line-strong);border-radius:12px;background:linear-gradient(160deg,#F2F4F8,#E7EAF1);height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink-soft)}
.slip .fake{width:220px;background:var(--surface);border-radius:8px;box-shadow:0 2px 12px rgba(26,29,35,.1);padding:18px;font-size:11px;line-height:1.7}
.slip .fake .bank{font-weight:700;color:var(--indigo);font-size:12px;margin-bottom:6px}
.slip .fake .amt{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;margin:6px 0}
.slip .fake .row2{display:flex;justify-content:space-between;color:var(--ink-soft)}
.meta{font-size:13.5px}.meta dt{color:var(--ink-faint);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:14px}
.meta dt:first-child{margin-top:0}.meta dd{margin:2px 0 0}.meta dd.mono{font-family:'IBM Plex Mono',monospace}
.match{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--green);background:var(--green-soft);border-radius:20px;padding:3px 10px;margin-left:8px}
.wait{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;display:inline-block}
.wait.old{background:var(--red-soft);color:var(--red)}.wait.new{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line)}
.upload{border:1.5px dashed var(--line-strong);border-radius:10px;padding:26px;text-align:center;color:var(--ink-faint);font-size:13.5px;cursor:pointer;transition:border-color .1s}
.upload:hover{border-color:var(--indigo)}.upload.filled{border-style:solid;border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:500}
.kv{display:grid;grid-template-columns:160px 1fr;gap:8px 16px;font-size:13.5px;margin:16px 0 6px}
.kv dt{color:var(--ink-faint)}.kv dd{font-weight:500}.kv dd.mono{font-family:'IBM Plex Mono',monospace}
.detail-head{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.detail-head .big{font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:600}
/* LINE mock */
.line-mock{background:#06C755;color:#fff;border-radius:10px;padding:14px 18px;font-size:13px;max-width:300px;margin-top:12px;line-height:1.6}
.line-mock .from{font-weight:600;font-size:12px;opacity:.8;margin-bottom:4px}
.screen{display:none}.screen.on{display:block}
@media(max-width:720px){.verify-grid{grid-template-columns:1fr}.summary{flex-wrap:wrap}.stat{min-width:calc(50% - 6px)}}
</style>
</head>
<body>
<nav class="nav">
  <span class="brand" onclick="go('dash')">AMANEW</span>
  <a id="nav-dash" class="active" onclick="go('dash')">Dashboard</a>
  <a id="nav-inv" onclick="go('invoices')">Invoices</a>
  <a id="nav-ver" onclick="go('verify')">Verify payments</a>
  <a id="nav-set" onclick="go('settings')">Room settings</a>
  <span class="user">Signed in as <b>Admin</b></span>
</nav>
<div id="app"></div>
<div class="overlay" id="modalHost"></div>
<script>
/* ═══════════ DATA ═══════════ */
const N=["Malee Srisuk","Prasit Boonmee","Anong Kaewta","Chai Thongdee","Kanya Phromma","Wichai Saelim","Duangjai Nilsson","Somsak Klahan","Pornthip Ruang","Thana Wongsa"];
const rooms=[];let nn=0;
[1,2,3,4].forEach(f=>{for(let i=1;i<=15;i++){
  const num=f*100+i,k=(f*7+i*3)%10;let r={num,floor:f,isDaily:false};
  if(num===102){r.status="vacant";r.tag="Vacant";r.isDaily=false;}
  else if(num===103){r.status="vacant";r.tag="Vacant";r.isDaily=true;}
  else if(num===104){r.status="daily";r.who="Nok Suwan";r.tag="Out 10 Jul";r.isDaily=true;}
  else if(num===105){r.status="monthly";r.who="Somchai Jaidee";r.tag="Monthly";r.isDaily=false;}
  else if(k<=4){r.status="monthly";r.who=N[nn++%10];r.tag="Monthly";r.isDaily=false;}
  else if(k<=6){r.status="vacant";r.isDaily=(i%3===0);r.tag="Vacant";}
  else if(k===7){r.status="daily";r.who=N[nn++%10];r.tag="Out "+(9+i%5)+" Jul";r.isDaily=true;}
  else if(k===8){r.status="reserved";r.who=N[nn++%10];r.tag="In "+(10+i%4)+" Jul";r.isDaily=true;}
  else{r.status="vacant";r.tag="Vacant";r.isDaily=false;}
  rooms.push(r);
}});
const KP="081-234-5678";
let S={banner:null,ciRoom:null,guest:null,newPh:null,dashTab:'monthly'};

/* ═══════════ ROUTER ═══════════ */
const app=document.getElementById('app');
function go(v,a){
  document.querySelectorAll('.nav a').forEach(x=>x.classList.remove('active'));
  const m={dash:'nav-dash',roomDetail:'nav-dash',checkin:'nav-dash',newTenant:'nav-dash',tenancy:'nav-dash',booking:'nav-dash',register:'nav-dash',endTenancy:'nav-dash',meters:'nav-dash',invoices:'nav-inv',invDetail:'nav-inv',genConfirm:'nav-inv',batch:'nav-inv',pay:'nav-inv',verify:'nav-ver',verDetail:'nav-ver',settings:'nav-set'};
  const el=document.getElementById(m[v]||'nav-dash');if(el)el.classList.add('active');
  app.innerHTML=V[v](a);window.scrollTo(0,0);
}
function modal(h){const x=document.getElementById('modalHost');x.innerHTML=h;x.classList.add('open');const f=x.querySelector('input')||x.querySelector('.btn.primary');if(f)f.focus();}
function closeModal(){const x=document.getElementById('modalHost');x.classList.remove('open');x.innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function busy(b,l,fn,ms=650){b.disabled=true;const t=b.textContent;b.innerHTML='<span class="spinner"></span>'+l;setTimeout(()=>{b.disabled=false;b.textContent=t;fn();},ms);}
const V={};

/* ═══════════ DASHBOARD ═══════════ */
V.dash=()=>{
  const c={vacant:0,monthly:0,daily:0,reserved:0};rooms.forEach(r=>c[r.status]++);
  const ban=S.banner?`<div class="banner">✓&nbsp; ${S.banner}<button class="x" onclick="S.banner=null;go('dash')">×</button></div>`:'';
  const monthlyRooms=rooms.filter(r=>!r.isDaily), dailyRooms=rooms.filter(r=>r.isDaily);
  const mCnt=monthlyRooms.length, dCnt=dailyRooms.length;
  function renderGrid(list){
    let out='';
    [1,2,3,4].forEach(f=>{
      const fl=list.filter(r=>r.floor===f);
      if(!fl.length)return;
      out+=`<section class="floor"><div class="floor-label">Floor ${f}</div><div class="grid">`+
        fl.map(r=>`<button class="room ${r.status}" onclick="go('roomDetail',${r.num})">
          <div class="num">${r.num}</div><div class="who">${r.who||'&nbsp;'}</div><span class="tag">${r.tag}</span></button>`).join('')+
        `</div></section>`;
    });
    return out;
  }
  return `<main class="page">${ban}
    <div style="display:flex;align-items:baseline;gap:16px;margin-bottom:20px"><h1>Room Dashboard</h1><span style="color:var(--ink-faint);font-size:13px">Wednesday 8 Jul 2026</span></div>
    <div class="summary">
      <div class="stat"><div class="label"><span class="dot g"></span>Vacant</div><div class="value">${c.vacant}</div></div>
      <div class="stat"><div class="label"><span class="dot i"></span>Monthly</div><div class="value">${c.monthly}</div></div>
      <div class="stat"><div class="label"><span class="dot a"></span>Daily</div><div class="value">${c.daily}</div></div>
      <div class="stat"><div class="label"><span class="dot r"></span>Reserved</div><div class="value">${c.reserved}</div></div>
    </div>
    <div class="tabs">
      <button class="tab ${S.dashTab==='monthly'?'on':''}" onclick="S.dashTab='monthly';go('dash')">Monthly rooms<span class="cnt">(${mCnt})</span></button>
      <button class="tab ${S.dashTab==='daily'?'on':''}" onclick="S.dashTab='daily';go('dash')">Daily rooms<span class="cnt">(${dCnt})</span></button>
      <button class="tab ${S.dashTab==='all'?'on':''}" onclick="S.dashTab='all';go('dash')">All rooms<span class="cnt">(${mCnt+dCnt})</span></button>
    </div>
    ${S.dashTab==='monthly'?renderGrid(monthlyRooms):S.dashTab==='daily'?renderGrid(dailyRooms):renderGrid(rooms)}
  </main>`;
};

/* ═══════════ ROOM DETAIL ═══════════ */
V.roomDetail=(num)=>{
  const r=rooms.find(x=>x.num===num);if(!r)return`<main class="page narrow"><p>Room not found</p></main>`;
  let info='',actions='',typeLabel=r.isDaily?'Daily':'Monthly';
  if(r.status==='vacant'&&!r.isDaily){
    info=`<dl class="kv"><dt>Type</dt><dd>Monthly</dd><dt>Status</dt><dd style="color:var(--green);font-weight:600">Vacant — ready for check-in</dd></dl>`;
    actions=`<button class="btn primary" onclick="S.ciRoom=${num};go('checkin')">Check in tenant</button>
             <button class="btn secondary" onclick="go('dash')">Back to dashboard</button>`;
  } else if(r.status==='vacant'&&r.isDaily){
    info=`<dl class="kv"><dt>Type</dt><dd>Daily</dd><dt>Status</dt><dd style="color:var(--green);font-weight:600">Vacant — ready for booking</dd><dt>Nightly rate</dt><dd class="mono">900.00 THB</dd></dl>`;
    actions=`<button class="btn primary" onclick="S.ciRoom=${num};go('checkin')">New booking</button>
             <button class="btn secondary" onclick="go('dash')">Back to dashboard</button>`;
  } else if(r.status==='monthly'){
    info=`<dl class="kv"><dt>Type</dt><dd>Monthly</dd><dt>Tenant</dt><dd>${r.who}</dd><dt>Phone</dt><dd class="mono">${r.num===105?KP:'08X-XXX-XXXX'}</dd><dt>Since</dt><dd>${r.num===105?'1 Apr 2026':'earlier'}</dd><dt>Deposit</dt><dd class="mono">5,000.00 THB</dd></dl>`;
    actions=`<button class="btn primary" onclick="go('meters',${num})">Enter meter readings</button>
             <button class="btn secondary" onclick="go('invoices')">View invoices</button>

function doReg(btn){let ok=true;
  const id=document.getElementById('rid'),fi=document.getElementById('f-rid'),ad=document.getElementById('raddr'),fa=document.getElementById('f-raddr');

function mU(){
  const e=parseFloat(document.getElementById('ecur').value),er=parseFloat(document.getElementById('erate').value);

/* ═══════════ PAYMENTS ═══════════ */
V.pay=()=>`<main class="page narrow">
  <div class="crumb"><a onclick="go('invoices')">Invoices</a> &rsaquo; <a onclick="go('invDetail')" class="mono">#1042</a> &rsaquo; <b>Submit payment</b></div>
  <h1>Payment — Invoice #1042</h1><p class="sub">Room 105 · Somchai Jaidee · Total due <span class="mono">4,980.00</span> THB</p>
  <div class="card" style="max-width:560px">
    <div class="field" style="max-width:220px"><label>Amount received (THB)</label><input class="mono" value="4980.00"></div>
    <div class="field" style="max-width:220px"><label>Payment method</label>
      <select id="pmethod" onchange="slipR()"><option value="transfer">Transfer</option><option value="qr">QR</option><option value="cash">Cash</option></select></div>
    <div class="field" id="f-slip"><label>Payment slip <span class="opt" id="slipReq">(required for transfer)</span></label>
      <div class="upload" id="slipbox" tabindex="0" onclick="this.classList.add('filled');this.textContent='✓ slip_1042.jpg — 214 KB';document.getElementById('f-slip').classList.remove('invalid')">Choose file — JPG, PNG or PDF, max 5MB</div>
      <p class="msg">A slip is required for transfer and QR payments</p></div>
    <div class="btn-row"><button class="btn primary" onclick="submitPay(this)">Submit payment</button>
      <button class="btn secondary" onclick="go('invDetail')">Cancel</button></div>
    <p class="hintline" style="margin-top:14px">The late fee is frozen at this moment.</p></div></main>`;
function slipR(){const m=document.getElementById('pmethod').value;
  document.getElementById('slipReq').textContent=m==='cash'?'(optional for cash)':`(required for ${m==='qr'?'QR':'transfer'})`;
  document.getElementById('f-slip').classList.remove('invalid');}
function submitPay(btn){const m=document.getElementById('pmethod').value,filled=document.getElementById('slipbox').classList.contains('filled');
  const f=document.getElementById('f-slip');f.classList.remove('invalid');
  if((m==='transfer'||m==='qr')&&!filled){f.classList.add('invalid');return;}
  busy(btn,'Submitting',()=>{S.banner=null;go('verify');});}

/* ═══════════ VERIFICATION ═══════════ */
V.verify=()=>`<main class="page mid">

  <div class="card" style="padding:8px 0"><table class="table">
    <tr><th style="padding-left:24px">Invoice</th><th>Room</th><th class="r">Amount</th><th>Method</th><th>Submitted by</th><th>Waiting</th></tr>
    <tr class="click" onclick="go('verDetail')"><td class="mono" style="padding-left:24px">#1038</td><td class="mono">112</td><td class="r mono">4,200.00</td><td>Transfer</td><td>Staff A · 3 Jul</td><td><span class="wait old">5 days</span></td></tr>
    <tr class="click" onclick="go('verDetail')"><td class="mono" style="padding-left:24px">#1042</td><td class="mono">105</td><td class="r mono">4,980.00</td><td>Transfer</td><td>Staff B · 8 Jul</td><td><span class="wait new">today</span></td></tr></table></div></main>`;

V.verDetail=()=>`<main class="page mid">
  <div class="crumb"><a onclick="go('verify')">Verify payments</a> &rsaquo; <b class="mono">#1042</b></div>
  <h1>Invoice #1042 — 4,980.00 THB · Transfer</h1><p class="sub">Room 105 · Somchai Jaidee</p>
  <div class="card"><div class="verify-grid">
    <div class="slip"><div class="fake"><div class="bank">◆ DEMO BANK</div><div>Transfer successful</div>
      <div class="amt">฿4,980.00</div><div class="row2"><span>To</span><span>AMANEW RESIDENCE</span></div>
      <div class="row2"><span>Date</span><span>8 Jul 2026 14:32</span></div><div class="row2"><span>Ref</span><span class="mono">TXN88214···</span></div></div>
      <span style="font-size:12px">Slip shown full size</span></div>
    <div><dl class="meta"><dt>Submitted by</dt><dd>Staff B · 8 Jul 2026, 14:35</dd><dt>Invoice total</dt><dd class="mono">4,980.00</dd>
      <dt>Amount recorded</dt><dd class="mono">4,980.00 <span class="match">✓ match</span></dd><dt>Late fee frozen</dt><dd class="mono">0.00</dd></dl>
      <div class="btn-row"><button class="btn primary" onclick="doVerify(this)">Verify payment</button>
        <button class="btn danger" onclick="rejectMod()">Reject</button></div>
      <p style="font-size:12.5px;color:var(--ink-faint);margin-top:16px">Only Admin can verify — the staff who recorded this cannot confirm it.</p>
      <div class="line-mock" style="margin-top:16px"><div class="from">LINE · Sent to tenant after verification</div>
        Amanew Residence<br>Payment confirmed ✓<br>Invoice #1042 · ฿4,980.00<br>Thank you!</div>
    </div></div></div></main>`;
function doVerify(btn){busy(btn,'Verifying',()=>{S.banner='Payment verified — Invoice #1042 is now Paid';go('dash');});}
function rejectMod(){
  modal(`<div class="modal"><div class="kicker danger">Reject payment — #1042</div><h2>Why is this being rejected?</h2>
    <p>The slip and payment record stay on file. The invoice returns to rejected until resubmitted.</p>
    <div class="field" id="f-rej" style="margin-top:14px"><label>Reason (required)</label>
      <input id="rejr" placeholder="e.g. amount does not match"><p class="msg">A reason is required</p></div>
    <div class="btn-row"><button class="btn danger" onclick="doReject()">Reject payment</button>
      <button class="btn secondary" onclick="closeModal()">Cancel</button></div></div>`);}
function doReject(){const r=document.getElementById('rejr'),f=document.getElementById('f-rej');
  f.classList.remove('invalid');r.classList.remove('err');
  if(!r.value.trim()){f.classList.add('invalid');r.classList.add('err');r.focus();return;}
  closeModal();S.banner='Payment rejected — reason recorded on Invoice #1042';go('dash');}

/* ═══════════ ROOM SETTINGS ═══════════ */
V.settings=()=>`<main class="page narrow">
  <h1>Room settings</h1><p class="sub">Admin only · Change a room's rental type. Every change is logged.</p>
  <div class="card" style="max-width:480px">
    <div class="field" style="max-width:280px"><label>Room</label>
      <select id="setR"><option value="102">Room 102 — monthly (occupied)</option><option value="115">Room 115 — monthly (vacant)</option></select></div>
    <div class="field" style="max-width:280px"><label>New type</label><select><option>Daily</option><option>Monthly</option></select></div>
    <p class="hintline">Rejected if the room has an active tenancy or upcoming booking.</p>
    <div class="btn-row"><button class="btn primary" onclick="tryType(this)">Change type</button></div></div></main>`;
function tryType(btn){const v=document.getElementById('setR').value;
  busy(btn,'Changing',()=>{
    if(v==='102'){modal(`<div class="modal"><div class="kicker danger">Change rejected</div><h2>Room 102 has an active tenancy</h2><p>The type cannot change until the tenancy ends.</p>
      <div class="btn-row"><button class="btn primary" onclick="closeModal()">OK</button></div></div>`);
    } else {S.banner='Room 115 changed to daily — logged';go('dash');}});}

/* boot */
go('dash');
